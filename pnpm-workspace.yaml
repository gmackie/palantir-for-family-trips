packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  '@better-auth/cli': 1.4.22
  '@better-auth/expo': 1.6.17
  '@biomejs/biome': ^2.4.15
  '@commitlint/cli': ^21.0.1
  '@commitlint/config-conventional': ^21.0.1
  '@storybook/addon-a11y': ^10.4.0
  '@storybook/addon-docs': ^10.4.0
  '@storybook/nextjs-vite': ^10.4.0
  '@tailwindcss/postcss': ^4.3.0
  '@tailwindcss/vite': ^4.3.0
  '@tanstack/react-form': ^1.32.0
  '@tanstack/react-query': ^5.100.11
  '@trpc/client': ^11.17.0
  '@trpc/server': ^11.17.0
  '@trpc/tanstack-react-query': ^11.17.0
  '@types/node': ^24.12.4
  '@vitejs/plugin-react': 6.0.2
  better-auth: 1.6.17
  knip: ^6.14.1
  lefthook: ^2.1.8
  oxlint: ^1.66.0
  storybook: ^10.4.0
  superjson: 2.2.6
  tailwindcss: ^4.3.0
  typescript: ~5.9.3
  vite: 8.0.13
  zod: ^4.4.3

catalogs:
  react19:
    '@types/react': ^19.2.15
    '@types/react-dom': ^19.2.3
    react: 19.2.3
    react-dom: 19.2.3

linkWorkspacePackages: true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild

overrides:
  '@types/minimatch': 5.1.2
  better-call: 1.3.5
  lightningcss: 1.30.1
  # Force solid-js >=1.9.11 so its transitive seroval dep resolves to ~1.5.0 (>=1.4.1),
  # clearing GHSA-3rxj-6cgf-8cfw / GHSA-hj76-42vx-jwp4 / GHSA-3j22-8qj3-26mx /
  # GHSA-66fc-rw6m-c2q6. solid-js is a peer of better-auth only; no workspace package
  # imports it directly, so this override has no app-code impact.
  solid-js: '>=1.9.11'
