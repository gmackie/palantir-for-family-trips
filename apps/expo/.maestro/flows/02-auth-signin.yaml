# Requests a magic link; verification requires opening the emailed HTTPS URL.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn:
    id: "email-input"
- inputText: ${TEST_EMAIL}
- tapOn:
    id: "send-magic-link"
- extendedWaitUntil:
    visible:
      id: "magic-link-sent"
    timeout: 10000
- takeScreenshot: auth-magic-link-sent
