# Requires a signed-in account with a workspace.
appId: ${APP_ID}
---
- launchApp
- tapOn:
    id: "open-settings"
- scrollUntilVisible:
    element:
      id: "sign-out"
    direction: DOWN
- tapOn:
    id: "sign-out"
- tapOn: "Sign out"
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000
- takeScreenshot: auth-signout-result
