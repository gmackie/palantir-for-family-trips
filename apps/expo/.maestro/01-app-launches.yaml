# Preflight launch smoke flow (path/name expected by the Preflight readiness
# check: .maestro/01-app-launches.yaml). References the native app id so the
# maestro_app_id readiness check passes (com.gmacko.sortey + .dev/.preview).
appId: ${APP_ID:-com.gmacko.sortey.dev}
---
# Smoke: the app binary launches without crashing. NOTE: preflight's simulator/
# development lanes install an Expo dev-client build, and a cold `launchApp`
# shows the dev-client launcher rather than the JS app — so we do NOT assert on
# app content here (that would always time out). The JS app itself is already
# exercised by the runner's dev-session/simulator.open step (Metro bundle load).
# This flow confirms the installed binary starts.
- launchApp

- takeScreenshot: launched
