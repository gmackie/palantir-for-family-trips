# Launch smoke flow — the Preflight build farm's default simulator-proof flow.
appId: com.gmacko.sortey.dev
name: "App Launches (smoke)"
tags: [smoke]
---
- launchApp
- runFlow:
    when:
      visible: "http://localhost:8081"
    commands:
      - tapOn: "http://localhost:8081"
      - waitForAnimationToEnd
- waitForAnimationToEnd
- assertVisible: ".*"
