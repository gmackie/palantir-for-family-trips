appId: com.gmacko.sortey.expo
name: "Sortey signed-out launch (smoke)"
tags: [smoke]
---
# Preflight opens this development client with the current Metro URL before
# running smoke. Preserve that session and wait for the actual Sortey screen.
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 90000
- assertVisible: "Send magic link"
- assertVisible: "Continue with Google"
- takeScreenshot: sortey-launched-signed-out
