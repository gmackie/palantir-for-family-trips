# TrueFlight standard workflow: permissions
# Sortey declares these iOS permission strings (app.config.ts ios.infoPlist + plugins):
#   NSLocationWhenInUseUsageDescription — "Sortey uses your location to show where you are on
#     the trip map, surface what's next on today's route, and suggest logging a stop when you
#     linger somewhere."  -> raised by Map -> "Share Location".
#   NSCameraUsageDescription — "Sortey uses the camera to scan receipts and capture trip photos."
#     -> raised by Add Expense -> "Scan Receipt".
#   NSPhotoLibraryUsageDescription — "Sortey accesses your photo library so you can attach
#     receipts and share photos with your trip group."  -> raised by Add Expense ->
#     "or choose from photo library" (PHPicker shows no prompt on iOS 14+; included for completeness).
#   expo-notifications (push) — requested on first launch by usePushNotifications in the root layout.
# Sortey is passwordless — see sign-in-organizer for how the magic-link bypass is used.
#
# tf:workflow id=permissions title="Permission prompts (notifications, location, camera, photos)" account=organizer
# tf:account role=organizer email="reviewer+organizer@sortey.app" secretRef=sortey/review/organizer_pw permissions=trips,members,invites,expenses,itinerary,map notes="Reuses the organizer reviewer account; any member of a destination-mode trip works."
# tf:verify "Push notifications are requested on first launch with the standard iOS prompt."
# tf:verify "Location is requested from the trip Map when you tap Share Location, with the stated purpose string, and the button flips to 'Sharing' once granted."
# tf:verify "Camera is requested from Add Expense -> Scan Receipt with the stated purpose string; the photo-library picker opens from 'or choose from photo library'."
# TODO: the simulator has no camera — on a simulator the camera prompt is granted but launchCameraAsync returns immediately; use a physical device to see the receipt capture itself.
appId: com.gmacko.sortey
---
# tf:step "Launch the app — iOS asks to allow notifications; tap Allow." capture=screenshot
- launchApp
- tapOn:
    text: "Allow"
    optional: true
# tf:step "Sign in with the organizer demo account (magic link via the demo bypass) and open the demo trip." capture=screenshot
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 15000
- tapOn: "you@example.com"
- inputText: "${TF_ACCOUNT_EMAIL}"
- tapOn: "Send magic link"
- extendedWaitUntil:
    visible: "Check your email"
    timeout: 15000
- evalScript: "${output.magicUrl = JSON.parse(http.post('https://sortey.app/api/auth/dev/sign-in/magic-link', { headers: { 'Content-Type': 'application/json', 'Origin': 'https://sortey.app' }, body: JSON.stringify({ email: TF_ACCOUNT_EMAIL, callbackURL: 'sortey:///' }) }).body).url}"
- openLink: "${output.magicUrl}"
- extendedWaitUntil:
    visible: "Your Trips"
    timeout: 30000
- tapOn: "Reviewer Reunion"
- extendedWaitUntil:
    visible: "Map"
    timeout: 15000
# tf:step "Open Map and tap Share Location — iOS asks for location while using the app; tap Allow Once or Allow While Using App." capture=video
- tapOn: "Map"
- extendedWaitUntil:
    visible: "Share Location"
    timeout: 20000
- tapOn: "Share Location"
- tapOn:
    text: "Allow While Using App"
    optional: true
- tapOn:
    text: "Allow Once"
    optional: true
# tf:step "Location sharing is on — the button now reads Sharing." capture=screenshot
- extendedWaitUntil:
    visible: "Sharing"
    timeout: 15000
- back
# tf:step "Back on the trip hub, tap Add Expense, then Scan Receipt — iOS asks for camera access; tap OK." capture=video
- extendedWaitUntil:
    visible: "Add Expense"
    timeout: 15000
- tapOn: "Add Expense"
- extendedWaitUntil:
    visible: "Scan Receipt"
    timeout: 15000
- tapOn: "Scan Receipt"
- tapOn:
    text: "OK"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true
# tf:step "Tap 'or choose from photo library' — the photo picker opens; cancel it." capture=screenshot
- tapOn: "or choose from photo library"
- tapOn:
    text: "Allow Full Access"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true
