# TrueFlight standard workflow: sign-in
# Reaching the authenticated app as a Sortey traveler. Proves the R1
# reviewer-login path. Sortey has a single end-user type (a trip participant
# who owns their default workspace), so one sign-in flow / one account.
#
# Build with the EAS review profile and configure the production
# DEMO_LOGIN_EMAILS allowlist (see docs/ai/APP_STORE_CHECKLIST.md).
# This flow uses only visible app controls; no evalScript mints a link.
#
# tf:workflow id=sign-in title="Sign in to Sortey" account=traveler
# tf:account role=traveler email="reviewer+traveler@sortey.app" secretRef=sortey/review/traveler_pw permissions=standard notes="Standard trip participant; owns the default workspace. Enter this email and tap Sign in for App Review; no password or inbox required."
# tf:verify "After the magic link, the workspace provisions and you reach the Sortey trips home (UserHeader with Settings + Sign out)."
appId: com.gmacko.sortey
---
# tf:step "Launch the app — you land on the Sortey sign-in screen." capture=screenshot
- launchApp
- assertVisible: "Sign in"
# tf:step "Enter the demo account email in the email field." capture=screenshot
- tapOn: "you@example.com"
- inputText: "${TF_ACCOUNT_EMAIL}"
# tf:step "Tap Sign in for App Review. The app completes sign-in without an inbox." capture=video
- tapOn: "Sign in for App Review"
# tf:step "The workspace provisions and you reach the trips home, signed in." capture=screenshot
# TODO: on a fresh account this shows "Welcome to Sortey"; on a seeded account it shows "Your Trips". Assert whichever the demo account is provisioned as.
- assertVisible: "Settings"
