# TrueFlight standard workflow: core-flow
# Sortey's headline feature is planning a group trip together: create a trip, then
# bring people in and coordinate expenses, itinerary, lodging and chat from one hub.
# This flow creates a new destination-mode trip through the New Trip wizard
# (template -> mode -> details -> dates -> Create Trip) and lands on the trip hub.
# Sortey is passwordless — see sign-in-organizer for how the magic-link bypass is used.
#
# tf:workflow id=core-flow title="Create a trip and reach the trip hub" account=organizer
# tf:account role=organizer email="reviewer+organizer@sortey.app" secretRef=sortey/review/organizer_pw permissions=trips,members,invites,expenses,itinerary,map notes="Trip organizer account. This flow creates an extra trip ('TrueFlight Review Trip') every run — tidy it up from the web app occasionally."
# TODO: confirm the organizer demo account can create trips in its workspace (workspace membership exists) and its password is stored at sortey/review/organizer_pw
# tf:verify "A new trip named 'TrueFlight Review Trip' is created and you land on its hub."
# tf:verify "The hub shows the planning tiles — Expenses, Itinerary, Members, Chat, Map — and the Add Expense / Invite quick actions."
appId: com.gmacko.sortey
---
# tf:step "Launch the app and sign in with the organizer demo account (magic link via the demo bypass)." capture=screenshot
- launchApp
# A session from an earlier run may still be cached in the keychain: sign out first so the
# flow always starts from the signed-out screen.
- extendedWaitUntil:
    visible: "Sign (in|out)"
    timeout: 20000
- runFlow:
    when:
      visible: "Sign out"
    commands:
      - tapOn: "Sign out"
      - tapOn:
          text: "Sign out"
          below: "Are you sure you want to sign out?"
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 20000
- tapOn: "you@example.com"
- inputText: "${TF_ACCOUNT_EMAIL}"
- tapOn: "Send magic link"
- extendedWaitUntil:
    visible: "Check your email"
    timeout: 15000
- evalScript: "${output.magicUrl = JSON.parse(http.post('https://sortey.app/api/auth/dev/sign-in/magic-link', { headers: { 'Content-Type': 'application/json', 'Origin': 'https://sortey.app' }, body: JSON.stringify({ email: TF_ACCOUNT_EMAIL, callbackURL: 'sortey:///' }) }).body).url}"
- openLink: "${output.magicUrl}"
# Safari asks "Open in Sortey?" before handing the custom-scheme redirect to the app.
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Your Trips"
    timeout: 30000
# tf:step "Tap + New on the Your Trips list to open the New Trip wizard." capture=screenshot
- tapOn: "+ New"
- extendedWaitUntil:
    visible: "Start a trip"
    timeout: 15000
# Buttons that carry an icon expose "<glyph>Label" to accessibility, so match with a regex.
- assertVisible: ".*Start from scratch.*"
# tf:step "Pick Start from scratch, then choose Destination as the trip type and Group (expense splitting), and tap Next." capture=screenshot
# The label also matches an enclosing container, so anchor on the card below the subtitle.
- tapOn:
    text: ".*Start from scratch.*"
    below: "Pick a template or start from scratch."
- extendedWaitUntil:
    visible: "What kind of trip?"
    timeout: 10000
- tapOn:
    text: ".*Fixed place.*"
    below: "What kind of trip?"
- tapOn:
    text: ".*Shared members.*"
    below: "Family or group?"
- tapOn: "Next"
# tf:step "Name the trip 'TrueFlight Review Trip' and tap Next (dates are optional)." capture=screenshot
- extendedWaitUntil:
    visible: "Trip Name"
    timeout: 10000
- tapOn: "Family Reunion 2026"
- inputText: "TrueFlight Review Trip"
- hideKeyboard
- tapOn: "Next"
# tf:step "Leave the dates empty (they are optional) and tap Create Trip." capture=video
- extendedWaitUntil:
    visible: "When?"
    timeout: 10000
- tapOn: "Create Trip"
# tf:step "You land on the new trip's hub with the planning tiles and quick actions." capture=screenshot
- extendedWaitUntil:
    visible: "TrueFlight Review Trip"
    timeout: 30000
- assertVisible: "Members"
- assertVisible: "Expenses"
# The quick-action row scrolls horizontally; Invite is the last action, so swipe it into view.
- swipe:
    from:
      text: ".*New Poll.*"
    direction: LEFT
- assertVisible: ".*Invite.*"
