# TrueFlight standard workflow: account-deletion
# Apple requires an in-app way to delete the account (App Store Review 5.1.1(v)).
# Running this green proves the R1 compliance gate.
# In Sortey the control lives on the Settings screen (Your Trips -> Settings -> Account
# section -> "Delete Account"). It calls trpc settings.deleteAccount (hard-deletes the
# user row; sessions, API keys and preferences cascade), signs you out, and shows an
# "Account deleted" alert before returning to the sign-in screen.
# Sortey is passwordless — see sign-in-organizer for how the magic-link bypass is used.
#
# tf:workflow id=account-deletion title="Delete your account" account=deletable
# tf:account role=deletable email="reviewer+delete@sortey.app" secretRef=sortey/review/delete_pw permissions=full notes="A throwaway account (member of no important trip) that is safe to permanently delete during review — it is destroyed by this flow and must be re-provisioned before the next run. Passwordless: the address must be listed in DEMO_LOGIN_EMAILS; no password is stored at the secretRef."
# TODO: confirm a real deletable demo account is provisioned on sortey.app (listed in DEMO_LOGIN_EMAILS; recreate it after every run) and its password is stored at sortey/review/delete_pw
# tf:verify "The account is deleted (settings.deleteAccount) and you are returned to the signed-out Sortey sign-in screen."
# tf:verify "Requesting a magic link again for the same address creates a fresh, empty account rather than restoring the old one."
appId: com.gmacko.sortey
---
# tf:step "Launch the app and sign in with the disposable demo account (magic link via the demo bypass)." capture=screenshot
- launchApp
# A session from an earlier run may still be cached in the keychain: sign out first so the
# flow always starts from the signed-out screen.
- extendedWaitUntil:
    visible: "Sign (in|out)"
    timeout: 20000
- runFlow:
    when:
      visible: "Sign out"
    commands:
      - tapOn: "Sign out"
      - tapOn:
          text: "Sign out"
          below: "Are you sure you want to sign out?"
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 20000
- tapOn: "you@example.com"
- inputText: "${TF_ACCOUNT_EMAIL}"
- tapOn: "Send magic link"
- extendedWaitUntil:
    visible: "Check your email"
    timeout: 15000
- evalScript: "${output.magicUrl = JSON.parse(http.post('https://sortey.app/api/auth/dev/sign-in/magic-link', { headers: { 'Content-Type': 'application/json', 'Origin': 'https://sortey.app' }, body: JSON.stringify({ email: TF_ACCOUNT_EMAIL, callbackURL: 'sortey:///' }) }).body).url}"
- openLink: "${output.magicUrl}"
# Safari asks "Open in Sortey?" before handing the custom-scheme redirect to the app.
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
# tf:step "Tap Settings in the header, then scroll down to the Account section." capture=screenshot
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Push notifications"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Delete Account"
    direction: DOWN
    timeout: 20000
# tf:step "Tap Delete Account and confirm the irreversible deletion in the alert." capture=video
- tapOn: "Delete Account"
# The confirmation alert repeats the label (and the Settings button is still behind it): pick the
# button between the alert message and Cancel.
- tapOn:
    text: "Delete Account"
    below: "This permanently deletes.*"
    above: "Cancel"
# tf:step "Sortey confirms 'Account deleted' and signs you out." capture=screenshot
- extendedWaitUntil:
    visible: "Account deleted"
    timeout: 20000
- tapOn: "OK"
# tf:step "You land back on the signed-out Sortey sign-in screen." capture=screenshot
- extendedWaitUntil:
    visible: "Send magic link"
    timeout: 15000
