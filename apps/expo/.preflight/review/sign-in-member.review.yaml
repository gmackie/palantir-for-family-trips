# TrueFlight review workflow: sign-in (trip member)
# Reaching the authenticated app as a plain trip member (joined via an invite; not the
# organizer). Proves the R1 reviewer-login path and the organizer-only gate on invite links.
# Sortey is passwordless — see sign-in-organizer for how the magic-link bypass is used.
#
# tf:workflow id=sign-in-member title="Sign in as a trip member" account=member
# tf:account role=member email="reviewer+member@sortey.app" secretRef=sortey/review/member_pw permissions=trips,expenses,itinerary,chat,map notes="Trip member — joined the organizer's demo trip via invite; cannot create invite links. Passwordless: the address must be listed in the backend DEMO_LOGIN_EMAILS allowlist; no password is stored at the secretRef."
# TODO: confirm a real member demo account is provisioned on sortey.app (listed in DEMO_LOGIN_EMAILS and a 'member' of the organizer's 'Reviewer Reunion' trip) and its password is stored at sortey/review/member_pw
# tf:verify "You reach the 'Your Trips' list, signed in as the member, and can open the shared trip."
# tf:verify "On the Members screen, Share invite is refused with 'Only trip organizers can create invite links.' (member role is enforced)."
appId: com.gmacko.sortey
---
# tf:step "Launch the app — you land on the Sortey sign-in screen." capture=screenshot
- launchApp
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 15000
- assertVisible: "Send magic link"
# tf:step "Enter the member demo email and tap Send magic link." capture=screenshot
- tapOn: "you@example.com"
- inputText: "${TF_ACCOUNT_EMAIL}"
- tapOn: "Send magic link"
- extendedWaitUntil:
    visible: "Check your email"
    timeout: 15000
# tf:step "Open the magic link (minted through the demo bypass); Sortey signs you in." capture=none
- evalScript: "${output.magicUrl = JSON.parse(http.post('https://sortey.app/api/auth/dev/sign-in/magic-link', { headers: { 'Content-Type': 'application/json', 'Origin': 'https://sortey.app' }, body: JSON.stringify({ email: TF_ACCOUNT_EMAIL, callbackURL: 'sortey:///' }) }).body).url}"
- openLink: "${output.magicUrl}"
# tf:step "You reach the Your Trips list, signed in, with the shared trip listed." capture=screenshot
- extendedWaitUntil:
    visible: "Your Trips"
    timeout: 30000
- assertVisible: "Reviewer Reunion"
# tf:step "Open the trip, then Members — you are listed with the member badge." capture=screenshot
- tapOn: "Reviewer Reunion"
- extendedWaitUntil:
    visible: "Members"
    timeout: 15000
- tapOn: "Members"
- extendedWaitUntil:
    visible: "Share invite"
    timeout: 15000
# tf:step "Tap Share invite — as a member you are told only organizers can create invite links." capture=screenshot
- tapOn: "Share invite"
- extendedWaitUntil:
    visible: "Cannot share invite"
    timeout: 10000
- tapOn: "OK"
