# Preflight build — ForgeGraph CI → Preflight build farm
#
# Drop this into an Expo app repo at `.forgejo/workflows/preflight-build.yml`.
# On push (and on demand) it enqueues a Preflight build of the *exact pushed
# commit*. The build runs on the Preflight build farm (the macOS runner), NOT
# in CI: CI only POSTs a source binding. The runner clones/fetches the commit
# into a dedicated clean checkout `/Volumes/dev/.preflight-ci/<repo>` (see the
# runner's ensureCiCheckout), so it never touches a developer's working tree.
#
# Setup per repo (one-time):
#   1. Forgejo secret  PREFLIGHT_TOKEN  — a Preflight token (gmk_… scoped to the
#      workspace, or the shared CLI token). Set at org level to share across repos.
#   2. Edit the `env:` block below for this app (the 5 APP_* values).
#
# No Preflight CLI / binary is needed in CI — this is a plain HTTP enqueue.

name: preflight-build
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      platform:
        description: ios | android
        default: ios
      lane:
        description: simulator | development
        default: simulator

env:
  PREFLIGHT_API: https://preflight.forgegraf.com
  WORKSPACE_ID: 00000000-0000-4000-8000-000000000001
  # ---- per-app identity (edit these) -------------------------------------
  APP_ID: pfapp_seed_sortie            # pf_app id
  APP_PACKAGE_PATH: apps/expo            # app dir within the repo
  APP_EXPO_SLUG: sortie
  APP_IOS_BUNDLE_ID: com.gmacko.sortey
  APP_EAS_PROJECT_ID: ""
  # ------------------------------------------------------------------------
  PLATFORM: ${{ github.event.inputs.platform || 'ios' }}
  LANE: ${{ github.event.inputs.lane || 'simulator' }}

jobs:
  enqueue:
    runs-on: ubuntu-latest
    steps:
      - name: Enqueue Preflight build of this commit
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY##*/}"
          REMOTE="https://git.forgegraf.com/${GITHUB_REPOSITORY}.git"
          BRANCH="${GITHUB_REF_NAME}"
          SHA="${GITHUB_SHA}"
          # Build dir on the farm: a Preflight-owned clean checkout, NOT a dev tree.
          WORKSPACE_ROOT="/Volumes/dev/.preflight-ci/${REPO}"

          BODY=$(cat <<JSON
          {
            "workspaceId": "${WORKSPACE_ID}",
            "sourceBinding": {
              "appId": "${APP_ID}",
              "packageName": "@${REPO}/expo",
              "packageManager": "pnpm",
              "workspaceRoot": "${WORKSPACE_ROOT}",
              "packagePath": "${APP_PACKAGE_PATH}",
              "workflowIntent": "prove-app",
              "platform": "${PLATFORM}",
              "lane": "${LANE}",
              "expoSlug": "${APP_EXPO_SLUG}",
              "iosBundleId": "${APP_IOS_BUNDLE_ID}",
              "easProjectId": "${APP_EAS_PROJECT_ID}",
              "expoConfigDigest": "sha256:ci-deferred",
              "easProfileName": "development",
              "gitRemoteUrl": "${REMOTE}",
              "gitBranch": "${BRANCH}",
              "gitCommitSha": "${SHA}"
            }
          }
          JSON
          )

          echo "Enqueuing ${PLATFORM}/${LANE} build of ${REPO}@${SHA:0:8} (branch ${BRANCH})"
          RESP=$(curl -sS -m 60 -X POST "${PREFLIGHT_API}/api/preflight/v1/workflows/prove-app" \
            -H "Authorization: Bearer ${{ secrets.PREFLIGHT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "${BODY}")
          echo "${RESP}" | head -c 1200; echo
          # Fail the CI step if Preflight did not accept the build.
          echo "${RESP}" | grep -q '"workflow"' || { echo "::error::Preflight did not queue the build"; exit 1; }
          WF=$(echo "${RESP}" | sed -n 's/.*"workflow":{"id":"\([^"]*\)".*/\1/p')
          echo "Queued Preflight workflow: ${WF}"
          echo "Track it: ${PREFLIGHT_API} → Queue board (workspace ${WORKSPACE_ID})"
